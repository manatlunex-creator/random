<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kral Games - Admin Panel ⚙️</title>
    <style>
        :root {
            --bg-dark: #050305;
            --bg-card: #0f0709;
            --neon-red: #ff003c;
            --neon-red-glow: rgba(255, 0, 60, 0.4);
            --text-main: #ffffff;
            --text-muted: #9e9e9e;
            --border-color: #2b0c14;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 60, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(138, 3, 33, 0.1) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(255, 0, 60, 0.2);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        .neon-title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 12px var(--neon-red);
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--neon-red);
            box-shadow: 0 0 12px var(--neon-red-glow);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff003c, #990024);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-red-glow);
            margin-top: 10px;
            text-transform: uppercase;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 7, 9, 0.9);
            border-bottom: 1px solid var(--border-color);
        }

        .admin-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .admin-section h4 {
            color: var(--neon-red);
            margin-bottom: 12px;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: #050305;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box span {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: var(--neon-red);
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ADMİN GİRİŞ EKRANI -->
    <div id="adminLoginScreen" class="screen active">
        <h1 class="neon-title" style="margin-top: 60px;">ADMİN PANEL ⚙️</h1>
        <div class="input-group">
            <input type="text" id="adminUser" placeholder="Admin istifadəçi adı">
        </div>
        <div class="input-group">
            <input type="password" id="adminPass" placeholder="Admin şifrəsi">
        </div>
        <button class="btn" onclick="adminLogin()">ADMİN GİRİŞİ</button>
    </div>

    <!-- ADMİN PANEL İDARƏETMƏ EKRANI -->
    <div id="adminPanelScreen" class="screen" style="padding: 0;">
        <div class="header">
            <h3>İdarə Paneli ⚙️</h3>
            <div style="cursor: pointer; color: var(--neon-red); font-size: 13px;" onclick="adminLogout()">Çıxış</div>
        </div>
        <div style="padding: 20px; overflow-y: auto; flex: 1;">
            
            <div class="stat-grid">
                <div class="stat-box">
                    <p style="font-size: 11px; color: var(--text-muted);">İstifadəçi</p>
                    <span id="statUsers">0</span>
                </div>
                <div class="stat-box">
                    <p style="font-size: 11px; color: var(--text-muted);">Stokda</p>
                    <span id="statStocks">0</span>
                </div>
                <div class="stat-box">
                    <p style="font-size: 11px; color: var(--text-muted);">Gözləyən</p>
                    <span id="statPending">0</span>
                </div>
            </div>

            <!-- KART NÖMRƏSİNİ DƏYİŞMƏK -->
            <div class="admin-section">
                <h4>💳 Ödəniş Kartını Yenilə</h4>
                <div class="input-group">
                    <input type="text" id="adminNewCardInput" placeholder="Yeni kart nömrəsini yaz">
                </div>
                <button class="btn" onclick="updateAdminCard()">Kartı Yenilə</button>
            </div>

            <!-- HESAB ƏLAVƏ ETMƏK -->
            <div class="admin-section">
                <h4>➕ Yeni Hesab Əlavə Et</h4>
                <div class="input-group">
                    <select id="adminGameSelect">
                        <option value="PUBG">PUBG Mobile</option>
                        <option value="eFootball">eFootball</option>
                    </select>
                </div>
                <div class="input-group">
                    <input type="text" id="adminAccountData" placeholder="Hesab məlumatı (gmail:şifrə)">
                </div>
                <div class="input-group">
                    <input type="number" id="adminPrice" placeholder="Qiymət (AZN)">
                </div>
                <button class="btn" onclick="addStock()">Stoka Əlavə Et</button>
            </div>

            <!-- DEPOZİTLƏR -->
            <div class="admin-section">
                <h4>💳 Təsdiq Gözləyən Depozitlər</h4>
                <div id="adminDepositsList">
                    <p style="color: var(--text-muted); font-size: 13px;">Gözləyən sorğu yoxdur.</p>
                </div>
            </div>

        </div>
    </div>

</div>

<script>
    let db = JSON.parse(localStorage.getItem('kral_games_db')) || {
        users: [],
        stocks: { PUBG: [], eFootball: [] },
        deposits: [],
        orders: [],
        cardNumber: "4169 7388 2000 1234"
    };

    let isAdminLoggedIn = localStorage.getItem('kral_admin_logged') === 'true';

    if(isAdminLoggedIn) {
        showAdminPanel();
    }

    function adminLogin() {
        let u = document.getElementById('adminUser').value.trim();
        let p = document.getElementById('adminPass').value.trim();

        if(u === 'Escoba211_1' && p === 'Qaqash211_5') {
            isAdminLoggedIn = true;
            localStorage.setItem('kral_admin_logged', 'true');
            showAdminPanel();
        } else {
            alert('Yanlış admin məlumatları!');
        }
    }

    function adminLogout() {
        isAdminLoggedIn = false;
        localStorage.removeItem('kral_admin_logged');
        document.getElementById('adminPanelScreen').classList.remove('active');
        document.getElementById('adminLoginScreen').classList.add('active');
        document.getElementById('adminUser').value = '';
        document.getElementById('adminPass').value = '';
    }

    function showAdminPanel() {
        document.getElementById('adminLoginScreen').classList.remove('active');
        document.getElementById('adminPanelScreen').classList.add('active');
        renderAdminPanel();
    }

    function updateAdminCard() {
        let newCard = document.getElementById('adminNewCardInput').value.trim();
        if(!newCard) {
            alert('Kart nömrəsini daxil edin!');
            return;
        }
        db.cardNumber = newCard;
        localStorage.setItem('kral_games_db', JSON.stringify(db));
        alert('Ödəniş kartı uğurla yeniləndi!');
        document.getElementById('adminNewCardInput').value = '';
    }

    function renderAdminPanel() {
        // Hər dəfə paneli açanda bazanı yenidən oxuyuruq ki, istifadəçi depozit atanda dərhal görsუნქ
        db = JSON.parse(localStorage.getItem('kral_games_db')) || db;

        let totalStocks = (db.stocks.PUBG ? db.stocks.PUBG.length : 0) + (db.stocks.eFootball ? db.stocks.eFootball.length : 0);
        let pendingCount = db.deposits.filter(d => d.status === 'pending').length;

        document.getElementById('statUsers').textContent = db.users.length;
        document.getElementById('statStocks').textContent = totalStocks;
        document.getElementById('statPending').textContent = pendingCount;

        let container = document.getElementById('adminDepositsList');
        let pending = db.deposits.filter(d => d.status === 'pending');
        if(pending.length === 0) {
            container.innerHTML = `<p style="color: var(--text-muted); font-size: 13px; text-align: center;">Gözləyən sorğu yoxdur.</p>`;
            return;
        }
        container.innerHTML = pending.map(d => `
            <div style="background: #050305; padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <p style="font-size: 14px; font-weight: bold;">👤 ${d.username}</p>
                    <p style="color: var(--neon-red); font-weight: bold; margin-top: 3px;">💰 ${d.amount} AZN</p>
                </div>
                <button class="btn" style="width: auto; padding: 6px 12px; margin: 0; font-size: 12px;" onclick="approveDeposit(${d.id})">Təsdiq (+2x)</button>
            </div>
        `).join('');
    }

    function approveDeposit(id) {
        db = JSON.parse(localStorage.getItem('kral_games_db')) || db;
        let dep = db.deposits.find(d => d.id === id);
        if(!dep) return;
        dep.status = 'approved';

        let targetUser = db.users.find(u => u.username === dep.username);
        if(targetUser) {
            let finalAmount = dep.amount;
            if(targetUser.isFirstDeposit) {
                finalAmount *= 2; 
                targetUser.isFirstDeposit = false;
            }
            targetUser.balance += finalAmount;
        }
        localStorage.setItem('kral_games_db', JSON.stringify(db));
        renderAdminPanel();
        alert('Depozit təsdiq olundu!');
    }

    function addStock() {
        let game = document.getElementById('adminGameSelect').value;
        let acc = document.getElementById('adminAccountData').value.trim();
        let price = parseFloat(document.getElementById('adminPrice').value);

        if(!acc || isNaN(price)) {
            alert('Məlumatları tam daxil edin!');
            return;
        }

        db = JSON.parse(localStorage.getItem('kral_games_db')) || db;
        db.stocks[game].push({id: Date.now(), account: acc, price: price});
        localStorage.setItem('kral_games_db', JSON.stringify(db));
        alert('Hesab stoka əlavə olundu!');
        document.getElementById('adminAccountData').value = '';
        document.getElementById('adminPrice').value = '';
        renderAdminPanel();
    }
</script>

</body>
</html>
